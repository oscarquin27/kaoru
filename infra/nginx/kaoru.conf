# Perímetro de Kaoru: TLS, sesión con oauth2-proxy y entrega del front.
# El navegador nunca ve un token: Nginx lo pide a oauth2-proxy y lo pone él mismo en la
# cabecera Authorization, sobrescribiendo lo que haya mandado el navegador.

# Los nombres se resuelven al usarse, no al arrancar: Nginx no se cae si un servicio reinicia.
resolver 127.0.0.11 valid=10s;

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Quien escribe http:// en el puerto de Kaoru recibe un 400 de Nginx («The plain HTTP request
    # was sent to HTTPS port»). Ese caso es el 497: se redirige a https con el mismo host y puerto
    # que pidió el navegador ($http_host lleva el puerto publicado, que puede no ser 8443).
    error_page 497 =301 https://$http_host$request_uri;

    # La cookie de sesión y el token son grandes.
    large_client_header_buffers 4 32k;
    proxy_buffer_size           32k;
    proxy_buffers               8 32k;
    # Un poco más que el límite de adjuntos de kaoru-api, que es quien responde el 413.
    client_max_body_size 26m;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Solo se permite embeber la vista previa opcional de Google Sheets (requerimiento §7.5.1).
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src https://docs.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $http_host;

    # Salud del propio Nginx, para el healthcheck del contenedor.
    location = /healthz {
        access_log off;
        return 204;
    }

    # Inicio y cierre de sesión.
    location /oauth2/ {
        set $oauth2 http://oauth2-proxy:4180;
        proxy_pass $oauth2;
    }

    # Pregunta interna: ¿esta petición trae una sesión válida?
    location = /oauth2/auth {
        internal;
        set $oauth2 http://oauth2-proxy:4180;
        proxy_pass $oauth2;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Keycloak: solo el login del realm y sus recursos. La consola de administración no se publica aquí.
    location /auth/realms/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
    }
    location /auth/resources/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
    }
    location /auth/ {
        return 404;
    }

    # API: exige sesión. Sin ella responde 401 y el front redirige al inicio de sesión.
    location /api/ {
        auth_request /oauth2/auth;
        auth_request_set $access_token $upstream_http_x_auth_request_access_token;

        set $api http://kaoru-api:8080;
        proxy_pass $api;
        # Se sobrescribe siempre: el navegador no puede inyectar su propio token.
        proxy_set_header Authorization "Bearer $access_token";
        proxy_set_header X-Request-Id  $request_id;
        proxy_set_header Cookie        "";
        proxy_request_buffering off;

        # El contenido de un documento se ve dentro del visor de Kaoru: es lo único que la propia
        # aplicación puede incrustar. Lo que el archivo puede hacer lo limita la política que
        # pone kaoru-api en esa respuesta. Mismas reglas de sesión y de token que el resto de la API.
        location ~ ^/api/documents/[^/]+/versions/[0-9]+/(content|preview)$ {
            auth_request /oauth2/auth;
            auth_request_set $access_token $upstream_http_x_auth_request_access_token;

            set $api http://kaoru-api:8080;
            proxy_pass $api;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header Authorization "Bearer $access_token";
            proxy_set_header X-Request-Id  $request_id;
            proxy_set_header Cookie        "";

            add_header X-Content-Type-Options    "nosniff" always;
            add_header X-Frame-Options           "SAMEORIGIN" always;
            add_header Referrer-Policy           "same-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy   "frame-ancestors 'self'" always;
        }
    }

    # Front: archivos estáticos, también detrás de la sesión.
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @login;

        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    location @login {
        return 302 /oauth2/start?rd=$request_uri;
    }
}
