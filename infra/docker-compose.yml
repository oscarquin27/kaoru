# Kaoru: un solo servidor con Docker, sin dependencias externas en tiempo de ejecución.
#   docker compose --env-file .env up -d --wait
# Las imágenes van fijadas por tag y digest. La de kaoru-api se construye con
# `make image` donde hay internet y viaja al servidor en el paquete offline.
name: kaoru

services:
  postgres:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaoru
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-kaoru.sh:ro
      - ./postgres/init.sql:/kaoru/init.sql:ro
    healthcheck:
      # Lista solo cuando existen las dos bases: la de Kaoru y la de Keycloak.
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaoru && psql -U postgres -d keycloak -qc 'select 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      # El emisor de los tokens es la URL pública; por dentro se le habla por HTTP.
      KC_HOSTNAME: ${KAORU_PUBLIC_URL:?}/auth
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT:-8081}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # Variables que usa el realm importado (infra/keycloak/kaoru-realm.json).
      KAORU_PUBLIC_URL: ${KAORU_PUBLIC_URL:?}
      KAORU_OIDC_CLIENT_SECRET: ${KAORU_OIDC_CLIENT_SECRET:?}
    volumes:
      - ./keycloak/kaoru-realm.json:/opt/keycloak/data/import/kaoru-realm.json:ro
      # Tema de login con la marca de Kaoru; viaja completo, sin recursos externos.
      - ./keycloak/themes/kaoru:/opt/keycloak/themes/kaoru:ro
    ports:
      # La consola de administración solo se alcanza desde el propio servidor.
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # La imagen no trae curl: se pregunta por /health/ready con bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  kaoru-api:
    image: ${KAORU_API_IMAGE:-kaoru-api:dev}
    restart: unless-stopped
    environment:
      KAORU_PUBLIC_URL: ${KAORU_PUBLIC_URL:?}
      POSTGRES_HOST: postgres:5432
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      KEYCLOAK_ISSUER: ${KAORU_PUBLIC_URL:?}/auth/realms/kaoru
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/kaoru/protocol/openid-connect/certs
      # Vacía si el servidor no tiene el servicio opcional `libreoffice`.
      KAORU_CONVERTER_URL: ${KAORU_CONVERTER_URL:-}
    volumes:
      - documents:/var/lib/kaoru/documents
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # El healthcheck viene en la imagen: `kaoru-api healthcheck`.

  # Opcional: convierte Office a PDF para la vista previa (Gotenberg, que envuelve LibreOffice).
  # Se activa con COMPOSE_PROFILES=office y KAORU_CONVERTER_URL en `.env`. Solo lo llama kaoru-api.
  libreoffice:
    image: gotenberg/gotenberg:8.25.0@sha256:e304e45acee3c400f8ef76afa195c76b1d0eaf0ab6fe9651e305067ab6a1560c
    profiles: [office]
    restart: unless-stopped
    command:
      - gotenberg
      # Solo conversión de Office: sin navegador, sin webhooks y sin bajar nada de fuera.
      - --chromium-disable-routes=true
      - --webhook-disable=true
      - --api-disable-download-from=true
      - --api-timeout=60s
      - --log-level=warn
    read_only: true
    tmpfs:
      - /tmp
      - /home/gotenberg
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1-alpine@sha256:a6f6c8e01971ffa0715adc0af1fb681e6a1bbbf2a8ccb7c41c8d063cc017eeb0
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --provider=keycloak-oidc
      - --client-id=kaoru-web
      - --redirect-url=${KAORU_PUBLIC_URL:?}/oauth2/callback
      # El navegador va a Keycloak por la URL pública; oauth2-proxy le habla por dentro.
      - --skip-oidc-discovery=true
      - --oidc-issuer-url=${KAORU_PUBLIC_URL:?}/auth/realms/kaoru
      - --login-url=${KAORU_PUBLIC_URL:?}/auth/realms/kaoru/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/auth/realms/kaoru/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/auth/realms/kaoru/protocol/openid-connect/certs
      - --code-challenge-method=S256
      - --scope=openid profile email
      # Los usuarios son locales y pueden no tener correo: se identifica por nombre de usuario.
      - --oidc-email-claim=preferred_username
      - --insecure-oidc-allow-unverified-email=true
      - --email-domain=*
      - --skip-provider-button=true
      # La sesión es una cookie; el token viaja solo de oauth2-proxy a Nginx.
      - --cookie-secure=true
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --cookie-expire=10h
      # El token de acceso dura 5 minutos: se renueva antes de que venza.
      - --cookie-refresh=3m
      - --set-xauthrequest=true
      - --pass-access-token=true
      # Al cerrar sesión se cierra también la de Keycloak; si no, el usuario volvería a entrar solo.
      - --backend-logout-url=http://keycloak:8080/auth/realms/kaoru/protocol/openid-connect/logout?id_token_hint={id_token}
      - --silence-ping-logging=true
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${KAORU_OIDC_CLIENT_SECRET:?}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?}
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4180/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    ports:
      - "${KAORU_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx/kaoru.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
      # El front compilado. En desarrollo se apunta a web/dist con KAORU_WEB_DIR.
      - ${KAORU_WEB_DIR:-./web}:/usr/share/nginx/html:ro
    depends_on:
      kaoru-api:
        condition: service_healthy
      oauth2-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  documents:
