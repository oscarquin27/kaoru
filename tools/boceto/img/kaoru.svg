<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Símbolo de Kaoru: K de una línea continua que une cuatro puntos. Un solo color.
       Los dos valores repiten --accent-text (oscuro) y --accent (claro) de css/tokens.css. -->
  <style>
    .k { stroke: #a9b2ff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .p { fill: #a9b2ff; }
    @media (prefers-color-scheme: light) { .k { stroke: #3d48b5; } .p { fill: #3d48b5; } }
  </style>
  <path class="k" d="M7 4v16V12l10-8L7 12l10 8"/>
  <circle class="p" cx="7" cy="4" r="1.8"/><circle class="p" cx="7" cy="20" r="1.8"/>
  <circle class="p" cx="17" cy="4" r="1.8"/><circle class="p" cx="17" cy="20" r="1.8"/>
</svg>
