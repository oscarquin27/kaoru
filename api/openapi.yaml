        package: { $ref: '#/components/schemas/CodeTitle' }
        deployment: { $ref: '#/components/schemas/DeploymentRef' }
        notes: { type: string }
        submittedBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        review:
          type: object
          description: Ausente mientras QA no lo revise.
          required: [result, notes, reviewedBy, reviewedAt]
          properties:
            result: { $ref: '#/components/schemas/DiagnosticResult' }
            notes: { type: string }
            reviewedBy: { $ref: '#/components/schemas/UserRef' }
            reviewedAt: { type: string, format: date-time }
    SmokeTestInput:
      type: object
      required: [deployment, result]
