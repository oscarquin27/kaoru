        deployment:
          allOf:
            - $ref: '#/components/schemas/Code'
          description: Código del DEP de un PKG en producción
        result: { type: string, enum: [passed, failed] }
        notes: { type: string }
    SmokeTest:
      type: object
      required: [code, package, deployment, result, notes, executedBy, createdAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        package: { $ref: '#/components/schemas/CodeTitle' }
        deployment: { $ref: '#/components/schemas/DeploymentRef' }
        result: { type: string, enum: [passed, failed] }
        notes: { type: string }
        executedBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }

    Report:
      type: object
      required: [code, package, version, checksum, issuedBy, createdAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        package: { $ref: '#/components/schemas/CodeTitle' }
        version: { type: integer, minimum: 1 }
        previous:
          allOf:
            - $ref: '#/components/schemas/Code'
          description: El informe al que reemplaza. Ausente en la primera versión.
        supersededBy:
          allOf:
            - $ref: '#/components/schemas/Code'
          description: El informe que lo reemplazó. Ausente en la versión vigente.
        checksum: { $ref: '#/components/schemas/Checksum' }
        issuedBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        content:
          type: string
