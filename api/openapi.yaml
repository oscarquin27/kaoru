            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [bundle]
      operationId: updatePackage
      summary: Edita el título o la descripción de un PKG
      description: Exige `pkg.build`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackagePatch' }
      responses:
        '200':
          description: PKG actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        default: { $ref: '#/components/responses/Problem' }

  /api/packages/{code}/transitions:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      tags: [bundle]
      operationId: transitionPackage
      summary: Cambia el estado de un PKG
      description: Responde `INVALID_ACTION` con lo que falta si una regla de bloqueo lo impide.
      requestBody: { $ref: '#/components/requestBodies/Transition' }
      responses:
        '200':
          description: PKG en su nuevo estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        default: { $ref: '#/components/responses/Problem' }

  /api/packages/{code}/builds/{build}:
    parameters:
      - $ref: '#/components/parameters/Code'
      - name: build
        in: path
        required: true
        description: Código del BUILD
        schema: { $ref: '#/components/schemas/Code' }
    put:
      tags: [bundle]
      operationId: addPackageBuild
      summary: Agrega un BUILD al PKG
      description: Exige `pkg.build` y que el PKG esté en armado. El BUILD debe ser del sistema del PKG.
      responses:
        '200':
          description: PKG con el BUILD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [bundle]
      operationId: removePackageBuild
      summary: Quita un BUILD del PKG
      description: Exige `pkg.build` y que el PKG esté en armado.
      responses:
        '200':
          description: PKG sin el BUILD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        default: { $ref: '#/components/responses/Problem' }

  /api/packages/{code}/requirements/{requirement}:
    parameters:
      - $ref: '#/components/parameters/Code'
      - name: requirement
        in: path
        required: true
        description: Código del REQ
        schema: { $ref: '#/components/schemas/Code' }
    put:
      tags: [bundle]
      operationId: addPackageRequirement
      summary: Agrega un REQ al PKG
      description: >-
        Exige `pkg.build` y que el PKG esté en armado. El REQ debe ser del sistema del PKG y estar
        «Aprobado QA» o «En paquete». Si está «Aprobado QA», pasa a «En paquete» con la misma acción,
        lo que además exige el permiso de esa transición.
      responses:
        '200':
          description: PKG con el REQ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [bundle]
      operationId: removePackageRequirement
      summary: Quita un REQ del PKG
      description: Exige `pkg.build` y que el PKG esté en armado. El estado del REQ no cambia.
      responses:
        '200':
          description: PKG sin el REQ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        default: { $ref: '#/components/responses/Problem' }

  /api/packages/{code}/regression:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [regression]
      operationId: getRegression
      summary: Selección de regresión de un PKG, propuesta contra final, con su avance
      description: Responde `NOT_FOUND_RESOURCE` si todavía no se propuso.
      responses:
        '200':
          description: Selección de regresión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Regression' }
        default: { $ref: '#/components/responses/Problem' }

  /api/packages/{code}/regression/proposal:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      tags: [regression]
      operationId: proposeRegression
      summary: Propone (o vuelve a proponer) la regresión del PKG
      description: >-
        Exige `regression.manage`. Propone los TC activos que ejercitan algún componente tocado por
        los REQ del PKG, más los TC críticos del sistema. Al volver a proponer se conservan los
        ajustes de QA. No se puede después de confirmar.
      responses:
        '200':
          description: Selección de regresión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Regression' }
        default: { $ref: '#/components/responses/Problem' }

  /api/packages/{code}/regression/items/{testCase}:
    parameters:
      - $ref: '#/components/parameters/Code'
      - name: testCase
        in: path
        required: true
        description: Código del TC
        schema: { $ref: '#/components/schemas/Code' }
    put:
      tags: [regression]
      operationId: adjustRegressionItem
      summary: Incluye o excluye un TC de la regresión, con su criterio
      description: >-
        Exige `regression.manage`. `reason` es obligatorio cuando la decisión difiere de lo propuesto
        (quitar un TC propuesto o agregar uno que no lo estaba). No se puede después de confirmar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [included]
              properties:
                included: { type: boolean }
                reason: { type: string }
      responses:
        '200':
          description: Selección de regresión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Regression' }
        default: { $ref: '#/components/responses/Problem' }

  /api/packages/{code}/regression/confirmation:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      tags: [regression]
      operationId: confirmRegression
      summary: Confirma la selección de regresión; desde entonces no cambia
      description: Exige `regression.manage`.
      responses:
        '200':
          description: Selección de regresión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Regression' }
        default: { $ref: '#/components/responses/Problem' }

  /api/checklist-templates:
    get:
      tags: [production]
      operationId: listChecklistTemplates
      summary: Versiones de la plantilla del checklist de producción, la más reciente primero
      parameters:
        - $ref: '#/components/parameters/SystemKey'
      responses:
        '200':
          description: Versiones de la plantilla
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChecklistTemplate' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [production]
      operationId: publishChecklistTemplate
      summary: Publica una versión nueva de la plantilla del checklist de un sistema
      description: >-
        Exige `chk.manage_template`. Una versión publicada no se edita: los checklists ya abiertos
        conservan la suya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChecklistTemplateInput' }
      responses:
        '201':
          description: Versión publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChecklistTemplate' }
        default: { $ref: '#/components/responses/Problem' }

  /api/checklists:
    get:
      tags: [production]
      operationId: listChecklists
      summary: Checklists de producción, del más reciente al más antiguo
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/PackageFilter'
      responses:
        '200':
          description: Página de CHK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Checklist' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [production]
      operationId: startChecklist
      summary: Abre el checklist de producción de un PKG con la última versión de la plantilla de su sistema
      description: Exige `chk.start`. El ambiente debe ser de producción y del sistema del PKG.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChecklistInput' }
      responses:
        '201':
          description: CHK abierto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checklist' }
        default: { $ref: '#/components/responses/Problem' }

  /api/checklists/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [production]
      operationId: getChecklist
      summary: Ficha de un checklist con sus pasos y firmas
      responses:
        '200':
          description: CHK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checklist' }
        default: { $ref: '#/components/responses/Problem' }

  /api/checklists/{code}/steps/{position}/signature:
    parameters:
      - $ref: '#/components/parameters/Code'
      - name: position
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [production]
      operationId: signChecklistStep
      summary: Firma un paso del checklist
      description: >-
        Exige `chk.sign`. La firma es el usuario de la sesión, la fecha del servidor y el comentario;
        un paso se firma una sola vez y no se desfirma (reglas §A.13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200':
          description: CHK con el paso firmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checklist' }
        default: { $ref: '#/components/responses/Problem' }

  /api/diagnostics:
    get:
      tags: [production]
      operationId: listDiagnostics
      summary: Diagnósticos posteriores al despliegue, del más reciente al más antiguo
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/PackageFilter'
      responses:
        '200':
          description: Página de DIAG
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Diagnostic' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [production]
      operationId: submitDiagnostic
      summary: Entrega el diagnóstico posterior a un despliegue de un PKG en producción
      description: Exige `diag.submit` (dev u ops, regla de negocio 7). Su salida se adjunta como DOC.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosticInput' }
      responses:
        '201':
          description: DIAG entregado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnostic' }
        default: { $ref: '#/components/responses/Problem' }

  /api/diagnostics/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [production]
      operationId: getDiagnostic
      summary: Ficha de un diagnóstico
      responses:
        '200':
          description: DIAG
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnostic' }
        default: { $ref: '#/components/responses/Problem' }

  /api/diagnostics/{code}/review:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      tags: [production]
      operationId: reviewDiagnostic
      summary: Revisa un diagnóstico y marca su resultado
      description: Exige `diag.review` (QA, regla de negocio 7). Un DIAG se revisa una sola vez.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosticReviewInput' }
      responses:
        '200':
          description: DIAG revisado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnostic' }
        default: { $ref: '#/components/responses/Problem' }

  /api/smoke-tests:
    get:
      tags: [production]
      operationId: listSmokeTests
      summary: Pruebas de humo posteriores al despliegue, de la más reciente a la más antigua
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/PackageFilter'
      responses:
        '200':
          description: Página de SMOKE
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SmokeTest' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [production]
      operationId: registerSmokeTest
      summary: Registra la prueba de humo posterior a un despliegue de un PKG en producción
      description: Exige `smoke.create` (QA, regla de negocio 7). No se edita ni se borra.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmokeTestInput' }
      responses:
        '201':
          description: SMOKE registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmokeTest' }
        default: { $ref: '#/components/responses/Problem' }

  /api/smoke-tests/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [production]
      operationId: getSmokeTest
      summary: Ficha de una prueba de humo
      responses:
        '200':
          description: SMOKE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmokeTest' }
        default: { $ref: '#/components/responses/Problem' }

  /api/reports:
    get:
      tags: [report]
      operationId: listReports
      summary: Informes de conformidad, del más reciente al más antiguo
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/PackageFilter'
      responses:
        '200':
          description: Página de RPT, sin su contenido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Report' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [report]
      operationId: issueReport
      summary: Emite el informe de conformidad de un PKG con lo que hay en ese momento
      description: >-
        Exige `rpt.issue`. Un informe emitido no cambia (regla de negocio 11): si el PKG ya tiene uno,
        se emite la versión siguiente, que referencia a la anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package]
              properties:
                package: { $ref: '#/components/schemas/Code' }
      responses:
        '201':
          description: RPT emitido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        default: { $ref: '#/components/responses/Problem' }

  /api/reports/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [report]
      operationId: getReport
      summary: Ficha de un informe con su contenido en Markdown
      responses:
        '200':
          description: RPT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        default: { $ref: '#/components/responses/Problem' }

  /api/reports/{code}/export:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [report]
      operationId: exportReport
      summary: Descarga el informe en Markdown o en PDF
      description: >-
        El Markdown es el contenido tal como se emitió: su SHA-256 es el hash del informe.
        El PDF se genera de ese mismo contenido, sin salir del servidor, y lleva el hash en el pie.
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [markdown, pdf] }
      responses:
        '200':
          description: Archivo
          content:
            text/markdown:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }

  /api/milestones:
    get:
      tags: [planning]
      operationId: listMilestones
      summary: Hitos del calendario, por fecha
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          description: Sin valor devuelve todos.
          schema: { type: string, enum: [pending, completed] }
      responses:
        '200':
          description: Página de hitos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Milestone' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [planning]
      operationId: createMilestone
      summary: Registra un hito
      description: Exige `milestone.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneInput' }
      responses:
        '201':
          description: Hito registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        default: { $ref: '#/components/responses/Problem' }

  /api/milestones/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [planning]
      operationId: updateMilestone
      summary: Edita un hito, lo marca cumplido o lo vuelve a dejar pendiente
      description: Exige `milestone.manage`. Un hito no se borra.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestonePatch' }
      responses:
        '200':
          description: Hito actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        default: { $ref: '#/components/responses/Problem' }

  /api/calendar:
    get:
      tags: [planning]
      operationId: getCalendar
      summary: Ventanas de cambio vigentes y alertas de atraso
      description: >-
        Las ventanas se leen de los CHG que no están cerrados ni rechazados. El atraso se calcula al leer:
        un hito pendiente con la fecha vencida, o un CHG cuya ventana terminó sin estar liberado.
      responses:
        '200':
          description: Calendario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        default: { $ref: '#/components/responses/Problem' }

  /api/activities:
    get:
      tags: [planning]
      operationId: listActivities
      summary: Actividades planificadas, por fecha de inicio
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: operator
          in: query
          description: Id de un operador.
          schema: { type: string }
        - name: change
          in: query
          description: Código del CHG.
          schema: { $ref: '#/components/schemas/Code' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ActivityKind' }
        - name: status
          in: query
          description: Sin valor devuelve todas, también las canceladas.
          schema: { $ref: '#/components/schemas/ActivityStatus' }
        - name: from
          in: query
          description: Solo las que terminan este día o después.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Solo las que empiezan este día o antes.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Página de actividades
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ActivitySummary' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [planning]
      operationId: createActivity
      summary: Planifica una actividad
      description: Exige `activity.manage`. Un solape no impide guardar; la respuesta lo trae.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInput' }
      responses:
        '201':
          description: Actividad planificada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        default: { $ref: '#/components/responses/Problem' }

  /api/activities/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [planning]
      operationId: getActivity
      summary: Ficha de una actividad con sus solapes
      responses:
        '200':
          description: Actividad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [planning]
      operationId: updateActivity
      summary: Reajusta una actividad, la cancela o la reactiva
      description: Exige `activity.manage`. Una actividad no se borra.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityPatch' }
      responses:
        '200':
          description: Actividad actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        default: { $ref: '#/components/responses/Problem' }

  /api/planning/schedule:
    get:
      tags: [planning]
      operationId: getSchedule
      summary: Quién hace qué en un rango de días, qué se solapa y qué proyectos coinciden
      description: >-
        Sin fechas, seis semanas desde el lunes de esta semana; como máximo 92 días. Las canceladas no cuentan.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive.
          schema: { type: string, format: date }
        - name: operator
          in: query
          description: Id de un operador; deja solo su fila.
          schema: { type: string }
      responses:
        '200':
          description: Planificación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Problem' }

  /api/metrics/coverage:
    get:
      tags: [metrics]
      operationId: getCoverageMetrics
      summary: Cobertura REQ por REQ
      description: >-
        Por cada REQ, los TC que exige (activos, que validan algún UC del REQ) y cuántos tienen su último RUN
        aprobado, frente al mínimo que fija la regla `min_coverage` para su nivel de riesgo. El resumen cuenta
        todo lo filtrado sin mirar `status`. Orden: por debajo del mínimo, sin TC, sin riesgo y al final los que
        cumplen; dentro de cada grupo, menor cobertura primero.
      parameters:
        - $ref: '#/components/parameters/SystemKey'
        - $ref: '#/components/parameters/MatrixChange'
        - $ref: '#/components/parameters/MatrixPackage'
        - $ref: '#/components/parameters/StateKey'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CoverageStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Cobertura por REQ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageMetrics' }
        default: { $ref: '#/components/responses/Problem' }

  /api/metrics/defect-states:
    get:
      tags: [metrics]
      operationId: getDefectStateMetrics
      summary: Tiempo que pasan los DEF en cada estado
      description: >-
        Sobre los DEF creados en el período, con su historia de transiciones de la auditoría. Para cada estado no
        final: cuántos DEF pasaron por él, cuántas veces se entró, y la mediana y el percentil 90 del tiempo total
        que cada DEF pasó ahí (lo que sigue abierto cuenta hasta ahora). Además, el tiempo de punta a punta de los
        DEF que están en un estado final. Sin período, los últimos 12 meses.
      parameters:
        - $ref: '#/components/parameters/SystemKey'
        - $ref: '#/components/parameters/MetricsSeverity'
        - $ref: '#/components/parameters/MetricsFrom'
        - $ref: '#/components/parameters/MetricsTo'
      responses:
        '200':
          description: Tiempo en estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectStateMetrics' }
        default: { $ref: '#/components/responses/Problem' }

  /api/metrics/regression:
    get:
      tags: [metrics]
      operationId: getRegressionMetrics
      summary: Tamaño de la regresión de cada PKG
      description: >-
        Una fila por PKG con la regresión confirmada en el período, la más reciente primero: TC propuestos,
        finales, agregados y quitados por QA, los finales por origen y cuántos tienen su último RUN sobre un BUILD
        del PKG aprobado. Sin período, los últimos 12 meses.
      parameters:
        - $ref: '#/components/parameters/SystemKey'
        - $ref: '#/components/parameters/MetricsFrom'
        - $ref: '#/components/parameters/MetricsTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Tamaño de regresión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegressionMetrics' }
        default: { $ref: '#/components/responses/Problem' }

  /api/metrics/escaped-defects:
    get:
      tags: [metrics]
      operationId: getEscapedDefectMetrics
      summary: Defectos escapados a producción
      description: >-
        Un DEF escapó si se abrió después de que su REQ llegó a producción: después del primer despliegue exitoso,
        en un ambiente de producción, de un PKG que contiene el REQ. Se calcula sobre los DEF creados en el
        período; la lista trae solo los escapados, el más reciente primero. Sin período, los últimos 12 meses.
      parameters:
        - $ref: '#/components/parameters/SystemKey'
        - $ref: '#/components/parameters/MetricsSeverity'
        - $ref: '#/components/parameters/MetricsFrom'
        - $ref: '#/components/parameters/MetricsTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Defectos escapados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscapedDefectMetrics' }
        default: { $ref: '#/components/responses/Problem' }

  /api/saved-views:
    get:
      tags: [savedview]
      operationId: listSavedViews
      summary: Vistas que guardó el usuario en sesión en una lista
      parameters:
        - name: screen
          in: query
          required: true
          schema: { $ref: '#/components/schemas/SavedViewScreen' }
      responses:
        '200':
          description: Lista, por nombre
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SavedView' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [savedview]
      operationId: saveView
      summary: Guarda los filtros de una lista con un nombre
      description: Es personal y no exige permiso. Hasta 30 por lista; el nombre no se repite dentro de una lista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screen, name, query]
              properties:
                screen: { $ref: '#/components/schemas/SavedViewScreen' }
                name: { type: string, minLength: 1, maxLength: 60 }
                query:
                  type: string
                  maxLength: 2000
                  description: Los filtros como van en la URL, sin el signo de interrogación.
      responses:
        '201':
          description: Vista guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        default: { $ref: '#/components/responses/Problem' }

  /api/saved-views/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [savedview]
      operationId: deleteSavedView
      summary: Quita una vista propia
      responses:
        '204':
          description: Vista quitada
        default: { $ref: '#/components/responses/Problem' }

  /api/search:
    get:
      tags: [traceability]
      operationId: search
      summary: Búsqueda global por ID o texto
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200':
          description: Resultados, con las coincidencias exactas de ID primero
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
        default: { $ref: '#/components/responses/Problem' }

  /api/requirements/{code}/overview:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [traceability]
      operationId: getRequirementOverview
      summary: Ficha consolidada del REQ
      description: Línea de vida con el tiempo en cada etapa, «qué falta para avanzar», cobertura y entidades relacionadas.
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementOverview' }
        default: { $ref: '#/components/responses/Problem' }

  /api/traceability/matrix:
    get:
      tags: [traceability]
      operationId: getMatrix
      summary: Matriz de trazabilidad
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/MatrixChange'
        - $ref: '#/components/parameters/SystemKey'
        - $ref: '#/components/parameters/StateKey'
        - $ref: '#/components/parameters/MatrixRisk'
        - $ref: '#/components/parameters/MatrixOwner'
        - $ref: '#/components/parameters/MatrixPackage'
        - $ref: '#/components/parameters/MatrixComponent'
        - $ref: '#/components/parameters/MatrixFrom'
        - $ref: '#/components/parameters/MatrixTo'
      responses:
        '200':
          description: Página de la matriz con sus indicadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Matrix' }
        default: { $ref: '#/components/responses/Problem' }

  /api/traceability/matrix/export:
    get:
      tags: [traceability]
      operationId: exportMatrix
      summary: Exporta la matriz filtrada
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, xlsx] }
        - $ref: '#/components/parameters/MatrixChange'
        - $ref: '#/components/parameters/SystemKey'
        - $ref: '#/components/parameters/StateKey'
        - $ref: '#/components/parameters/MatrixRisk'
        - $ref: '#/components/parameters/MatrixOwner'
        - $ref: '#/components/parameters/MatrixPackage'
        - $ref: '#/components/parameters/MatrixComponent'
        - $ref: '#/components/parameters/MatrixFrom'
        - $ref: '#/components/parameters/MatrixTo'
      responses:
        '200':
          description: Archivo
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }

  /api/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Consulta la auditoría
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: entityCode
          in: query
          schema: { $ref: '#/components/schemas/Code' }
        - name: actor
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Página de registros, del más reciente al más antiguo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
        default: { $ref: '#/components/responses/Problem' }

  /api/audit/export:
    get:
      tags: [audit]
      operationId: exportAudit
      summary: Exporta la auditoría en CSV
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Archivo CSV
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /api/audit/verification:
    get:
      tags: [audit]
      operationId: verifyAudit
      summary: Recalcula la cadena de hash y dice si está íntegra
      responses:
        '200':
          description: Resultado de la verificación
          content:
            application/json:
              schema:
                type: object
                required: [intact, entries]
                properties:
                  intact: { type: boolean }
                  entries: { type: integer }
                  firstBrokenSeq:
                    type: integer
                    format: int64
                    description: Primer registro que no cuadra, si la cadena está rota.
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: _oauth2_proxy
      description: Cookie de sesión de oauth2-proxy. Nginx la cambia por el token antes de llegar al backend.

  parameters:
    Code:
      name: code
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Code' }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
    Query:
      name: q
      in: query
      description: Texto a buscar en el título
      schema: { type: string }
    SystemKey:
      name: system
      in: query
      description: Clave del sistema (`SIMF`, `SGLPAR`, `SYPAGO`)
      schema: { type: string }
    StateKey:
      name: state
      in: query
      description: Clave del estado en su flujo
      schema: { type: string }
    WorkflowEntityType:
      name: entityType
      in: path
      required: true
      schema: { type: string, enum: [requirement, change, defect, package] }
    EntityType:
      name: entityType
      in: query
      required: true
      schema: { $ref: '#/components/schemas/EntityType' }
    EntityCode:
      name: entityCode
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Code' }
    MatrixChange:
      name: change
      in: query
      description: Código del CHG
      schema: { $ref: '#/components/schemas/Code' }
    MatrixRisk:
      name: risk
      in: query
      schema: { $ref: '#/components/schemas/RiskLevel' }
    MatrixOwner:
      name: owner
      in: query
      schema: { type: string }
    MatrixPackage:
      name: package
      in: query
      description: Código de un PKG que incluye el REQ
      schema: { $ref: '#/components/schemas/Code' }
    MatrixComponent:
      name: component
      in: query
      description: Código de un COMP que toca el REQ
      schema: { $ref: '#/components/schemas/Code' }
    PackageFilter:
      name: package
      in: query
      description: Código del PKG
      schema: { $ref: '#/components/schemas/Code' }
    MatrixFrom:
      name: from
      in: query
      description: REQ creados desde esta fecha
      schema: { type: string, format: date }
    MatrixTo:
      name: to
      in: query
      description: REQ creados hasta esta fecha
      schema: { type: string, format: date }

    MetricsSeverity:
      name: severity
      in: query
      schema: { $ref: '#/components/schemas/Severity' }
    MetricsFrom:
      name: from
      in: query
      description: Desde esta fecha (UTC). Sin ella, el primer día del mes de hace 11 meses.
      schema: { type: string, format: date }
    MetricsTo:
      name: to
      in: query
      description: Hasta esta fecha, inclusive (UTC). Sin ella, sin límite.
      schema: { type: string, format: date }

  requestBodies:
    Transition:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [to]
            properties:
              to:
                type: string
                description: Clave del estado destino
              reason:
                type: string
                description: Motivo. Obligatorio si la transición lo exige.

  responses:
    Problem:
      description: Error (RFC 9457). El código HTTP sale de la tabla de reglas §A.10.2.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Code:
      type: string
      pattern: '^[A-Z]+-\d{4}-\d{4,}$'
      example: REQ-2026-0042
    Role:
      type: string
      enum: [change-manager, qa-admin, qa, dev, ops, auditor]
    Severity:
      type: string
      enum: [high, medium, low]
    RiskLevel:
      type: string
      enum: [high, medium, low]
    Route:
      type: string
      enum: [high, light, minor_fix]
      description: Ruta del CHG. `high` alta, `light` ligera, `minor_fix` fix menor.
    QualityCharacteristic:
      type: string
      description: Característica de calidad de ISO/IEC 25010.
      enum:
        - functional_suitability
        - performance_efficiency
        - compatibility
        - usability
        - reliability
        - security
        - maintainability
        - portability
    EntityType:
      type: string
      enum: [requirement, change, functional_case, test_case, test_run, exploratory_session, defect, package, deployment, checklist, diagnostic, smoke_test]
    DocumentKind:
      type: string
      enum: [specification, manual, evidence, minutes, snapshot, other]
    LinkKind:
      type: string
      enum: [google_sheets, youtrack, shared_folder, wiki, other]
    RunResult:
      type: string
      enum: [passed, failed, blocked]
    Checksum:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 en hexadecimal.

    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, example: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: INVALID_ACTION }
        detail: { type: string }
        traceId: { type: string }
        errors:
          type: array
          description: Solo en un 422.
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string, enum: [required, invalid] }
              message: { type: string }

    PageInfo:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }

    User:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }

    Missing:
      type: object
      description: Lo que falta para una transición.
      required: [to, conditions]
      properties:
        to: { $ref: '#/components/schemas/StateRef' }
        conditions:
          type: array
          items:
            type: object
            required: [ruleKey, message, blocks, related]
            properties:
              ruleKey: { type: string }
              message:
                type: string
                example: 'Faltan 2 TC sin RUN aprobado: TC-2026-0112, TC-2026-0113.'
              blocks:
                type: boolean
                description: Con `false`, la condición solo avisa.
              related:
                type: array
                items: { $ref: '#/components/schemas/Code' }

    ComponentKind:
      type: string
      enum: [microservice, library, script, kafka_topic, db_schema, other]
    ComponentRef:
      type: object
      required: [code, name, kind]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ComponentKind' }
    ComponentInput:
      type: object
      required: [system, kind, name]
      properties:
        system:
          type: string
          description: Clave del sistema
        kind: { $ref: '#/components/schemas/ComponentKind' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }
    ComponentPatch:
      type: object
      properties:
        kind: { $ref: '#/components/schemas/ComponentKind' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }
        retired:
          type: boolean
          description: Un componente retirado ya no se ofrece para declarar impacto.
    Component:
      type: object
      required: [code, system, kind, name, description, retired, createdBy, createdAt, updatedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        system: { $ref: '#/components/schemas/System' }
        kind: { $ref: '#/components/schemas/ComponentKind' }
        name: { type: string }
        description: { type: string }
        retired: { type: boolean }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BuildInput:
      type: object
      required: [system, version, checksum]
      properties:
        system:
          type: string
          description: Clave del sistema
        version: { type: string, minLength: 1, maxLength: 80 }
        checksum: { $ref: '#/components/schemas/Checksum' }
        requirements:
          type: array
          description: REQ incluidos en el BUILD. Deben ser del mismo sistema.
          items: { $ref: '#/components/schemas/Code' }
        migrations:
          type: string
          description: Migraciones que trae, una por línea.
        dependencies:
          type: string
          description: Dependencias y sus versiones, una por línea.
        notes: { type: string }
    BuildRef:
      type: object
      required: [code, version, checksum]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        version: { type: string }
        checksum: { $ref: '#/components/schemas/Checksum' }
    Build:
      type: object
      required: [code, system, version, checksum, requirements, migrations, dependencies, notes, builtBy, createdAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        system: { $ref: '#/components/schemas/System' }
        version: { type: string }
        checksum: { $ref: '#/components/schemas/Checksum' }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/CodeTitle' }
        migrations: { type: string }
        dependencies: { type: string }
        notes: { type: string }
        builtBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }

    EnvironmentKind:
      type: string
      enum: [clean, baseline, offline, production]
    OperatingSystem:
      type: string
      enum: [windows, linux]
    DeploymentResult:
      type: string
      enum: [success, failed, rolled_back]
    EnvironmentInput:
      type: object
      required: [system, name, kind, os]
      properties:
        system:
          type: string
          description: Clave del sistema
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { $ref: '#/components/schemas/EnvironmentKind' }
        os: { $ref: '#/components/schemas/OperatingSystem' }
        notes: { type: string }
    EnvironmentPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { $ref: '#/components/schemas/EnvironmentKind' }
        os: { $ref: '#/components/schemas/OperatingSystem' }
        notes: { type: string }
        retired: { type: boolean }
    EnvironmentRef:
      type: object
      required: [code, name, kind]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/EnvironmentKind' }
    Environment:
      type: object
      required: [code, system, name, kind, os, notes, retired, createdBy, createdAt, updatedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        system: { $ref: '#/components/schemas/System' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/EnvironmentKind' }
        os: { $ref: '#/components/schemas/OperatingSystem' }
        notes: { type: string }
        retired: { type: boolean }
        installed:
          type: object
          description: Lo que dejó el último despliegue exitoso. Ausente si nunca hubo uno.
          required: [deployment, deployedAt]
          properties:
            deployment: { $ref: '#/components/schemas/Code' }
            build: { $ref: '#/components/schemas/BuildRef' }
            package: { $ref: '#/components/schemas/CodeTitle' }
            deployedAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DeploymentInput:
      type: object
      description: Lleva `build` o `package`, uno de los dos.
      required: [environment, result, executedAt]
      properties:
        environment: { $ref: '#/components/schemas/Code' }
        build: { $ref: '#/components/schemas/Code' }
        package: { $ref: '#/components/schemas/Code' }
        result: { $ref: '#/components/schemas/DeploymentResult' }
        notes: { type: string }
        executedAt:
          type: string
          format: date-time
          description: Cuándo se desplegó. No puede ser futura.
    Deployment:
      type: object
      required: [code, environment, result, notes, executedBy, executedAt, createdAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        environment: { $ref: '#/components/schemas/EnvironmentRef' }
        build: { $ref: '#/components/schemas/BuildRef' }
        package: { $ref: '#/components/schemas/CodeTitle' }
        result: { $ref: '#/components/schemas/DeploymentResult' }
        notes: { type: string }
        executedBy: { $ref: '#/components/schemas/UserRef' }
        executedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PackageInput:
      type: object
      required: [title, system]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        system:
          type: string
          description: Clave del sistema
    PackagePatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
    Package:
      type: object
      required: [code, title, description, system, state, builds, requirements, missing, createdBy, createdAt, updatedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        description: { type: string }
        system: { $ref: '#/components/schemas/System' }
        state: { $ref: '#/components/schemas/StateRef' }
        route:
          allOf:
            - $ref: '#/components/schemas/Route'
          description: >-
            La ruta más exigente de las de sus REQ; sin REQ, la del sistema. Decide qué reglas de
            bloqueo aplican. Solo viene en la ficha.
        builds:
          type: array
          items: { $ref: '#/components/schemas/BuildRef' }
        requirements:
          type: array
          items:
            type: object
            required: [code, title, state]
            properties:
              code: { $ref: '#/components/schemas/Code' }
              title: { type: string }
              state: { $ref: '#/components/schemas/StateRef' }
        missing:
          type: array
          description: >-
            Qué falta para avanzar, por cada transición posible desde el estado actual.
            En las listas viene vacío: se calcula solo en la ficha.
          items: { $ref: '#/components/schemas/Missing' }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegressionOrigin:
      type: string
      description: Por qué está el TC. `impact` cruza con un componente tocado; `critical` es crítico del sistema; `manual` lo agregó QA.
      enum: [impact, critical, manual]
    Regression:
      type: object
      required: [package, proposedBy, proposedAt, summary, items]
      properties:
        package: { $ref: '#/components/schemas/Code' }
        proposedBy: { $ref: '#/components/schemas/UserRef' }
        proposedAt: { type: string, format: date-time }
        confirmedBy: { $ref: '#/components/schemas/UserRef' }
        confirmedAt: { type: string, format: date-time }
        summary:
          type: object
          required: [proposed, included, added, removed, passed, failed, pending]
          properties:
            proposed:
              type: integer
              description: TC que propuso el sistema
            included:
              type: integer
              description: TC de la selección final
            added:
              type: integer
              description: TC que agregó QA
            removed:
              type: integer
              description: TC propuestos que QA quitó
            passed:
              type: integer
              description: De la selección final, con su último RUN sobre un BUILD del PKG aprobado
            failed:
              type: integer
              description: De la selección final, con su último RUN sobre un BUILD del PKG fallido o bloqueado
            pending:
              type: integer
              description: De la selección final, sin RUN sobre un BUILD del PKG
        items:
          type: array
          description: Todos los TC propuestos o agregados, incluidos los que QA quitó.
          items:
            type: object
            required: [testCase, isCritical, origin, proposed, included, reason, components]
            properties:
              testCase: { $ref: '#/components/schemas/CodeTitle' }
              isCritical: { type: boolean }
              origin: { $ref: '#/components/schemas/RegressionOrigin' }
              proposed: { type: boolean }
              included: { type: boolean }
              reason:
                type: string
                description: Criterio del ajuste de QA; vacío si la decisión coincide con lo propuesto.
              decidedBy: { $ref: '#/components/schemas/UserRef' }
              decidedAt: { type: string, format: date-time }
              components:
                type: array
                description: Componentes del TC que tocan los REQ del PKG.
                items: { $ref: '#/components/schemas/ComponentRef' }
              lastRun:
                allOf:
                  - $ref: '#/components/schemas/RunSummary'
                description: Último RUN del TC sobre un BUILD del PKG.

    ChecklistStepInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
    ChecklistTemplateInput:
      type: object
      required: [system, steps]
