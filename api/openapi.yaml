    MilestoneInput:
      type: object
      required: [title, dueDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        dueDate: { type: string, format: date }
        owner:
          type: string
          description: Id del usuario responsable. Vacío si nadie lo tiene.
        notes: { type: string }
    MilestonePatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        dueDate: { type: string, format: date }
        owner:
          type: string
          description: Id del usuario responsable. Vacío lo deja sin responsable.
        notes: { type: string }
        completed: { type: boolean }
    Milestone:
      type: object
      required: [id, title, dueDate, notes, completed, daysLate, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        dueDate: { type: string, format: date }
        notes: { type: string }
        owner: { $ref: '#/components/schemas/UserRef' }
        completed: { type: boolean }
        completedAt: { type: string, format: date-time }
        daysLate:
          type: integer
          description: Días de atraso de un hito pendiente; cero si no está atrasado o ya se cumplió.
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Calendar:
      type: object
      required: [windows, alerts]
      properties:
        windows:
          type: array
          description: Ventanas de los CHG vigentes, por fecha de inicio.
          items:
            type: object
            required: [change, system, route, state, start, end, daysLate]
            properties:
              change: { $ref: '#/components/schemas/CodeTitle' }
              system: { type: string }
              route: { $ref: '#/components/schemas/Route' }
              state: { $ref: '#/components/schemas/StateRef' }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              daysLate:
                type: integer
                description: Días desde que terminó la ventana sin que el CHG esté liberado; cero si no hay atraso.
        alerts:
          type: array
          description: Lo atrasado, lo más atrasado primero.
          items:
            type: object
            required: [kind, title, dueAt, daysLate]
            properties:
              kind: { type: string, enum: [milestone, change_window] }
              title: { type: string }
              change:
                allOf:
                  - $ref: '#/components/schemas/Code'
                description: El CHG, si la alerta es de una ventana.
              milestone:
                type: string
                format: uuid
                description: El hito, si la alerta es de un hito.
              dueAt: { type: string, format: date-time }
              daysLate: { type: integer, minimum: 1 }

    ActivityKind:
      type: string
      enum: [certification, regression, production, other]
    ActivityStatus:
      type: string
