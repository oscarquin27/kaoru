        createdAt: { type: string, format: date-time }

    DeploymentRef:
      type: object
      required: [code, environment, executedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        environment: { $ref: '#/components/schemas/EnvironmentRef' }
        executedAt: { type: string, format: date-time }
    DiagnosticResult:
      type: string
      description: "`conforming` conforme, `non_conforming` no conforme."
      enum: [conforming, non_conforming]
    DiagnosticInput:
      type: object
      required: [deployment]
      properties:
        deployment:
          allOf:
            - $ref: '#/components/schemas/Code'
          description: Código del DEP de un PKG en producción
        notes: { type: string }
    DiagnosticReviewInput:
