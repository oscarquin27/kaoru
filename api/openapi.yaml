openapi: 3.0.3
info:
  title: Kaoru API
  version: 0.1.0
  description: |
    Contrato HTTP entre `kaoru-api` y el front (reglas §A.16.1). Cubre el MVP y las fases 3 y 4.

    - Todo vive bajo `/api/`, sin versión.
    - La sesión es la cookie de oauth2-proxy; el navegador no maneja tokens.
    - Los recursos con ID legible se direccionan por su código (`REQ-2026-0042`).
    - Los errores son `application/problem+json` (RFC 9457).
    - Toda petición `POST`, `PUT`, `PATCH` o `DELETE` debe traer `Origin` igual al origen público.

    Fuera del contrato hasta que se defina el formato de la hoja (pregunta 5): la importación.
  license:
    name: Uso interno
    url: https://example.invalid/uso-interno
servers:
  - url: /
security:
  - session: []
tags:
  - name: user
    description: Sesión, perfil y usuarios
  - name: workflow
    description: Flujos configurables, permisos por rol y reglas de bloqueo
  - name: change
    description: Cambios (CHG)
  - name: requirement
    description: Requerimientos (REQ), enlaces y contrato de entrada
  - name: risk
    description: Evaluación de riesgo (RISK)
  - name: testdesign
    description: Casos de uso (UC) y casos de prueba (TC)
  - name: execution
    description: Ejecuciones (RUN) y exploraciones (EXP)
  - name: defect
    description: Defectos (DEF)
  - name: document
    description: Documentos versionados (DOC)
  - name: comment
    description: Comentarios
  - name: component
    description: Catálogo de componentes (COMP) e impacto
  - name: build
    description: Artefactos inmutables (BUILD)
  - name: environment
    description: Ambientes (ENV) y despliegues (DEP)
  - name: bundle
    description: Paquetes (PKG)
  - name: regression
    description: Selección de regresión por impacto
  - name: production
    description: Checklist de producción con firmas (CHK), diagnóstico (DIAG) y prueba de humo (SMOKE)
  - name: report
    description: Informe de conformidad (RPT)
  - name: planning
    description: Hitos, ventanas de cambio y alertas de atraso
  - name: metrics
    description: Métricas de cobertura, defectos, regresión y defectos escapados (solo lectura)
  - name: savedview
    description: Vistas guardadas (filtros de una lista con nombre, personales)
  - name: traceability
    description: Ficha consolidada, matriz y búsqueda
  - name: audit
    description: Auditoría inmutable

paths:
  /api/me:
    get:
      tags: [user]
      operationId: getMe
      summary: Perfil, roles y permisos del usuario en sesión
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }

  /api/users:
    get:
      tags: [user]
      operationId: listUsers
      summary: Usuarios que ya entraron a Kaoru, para elegir responsables
      description: Devuelve como máximo 50, ordenados por nombre. El directorio completo vive en Keycloak.
      parameters:
        - name: q
          in: query
          description: Texto contenido en el nombre o en el usuario
          schema: { type: string }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }

  /api/systems:
    get:
      tags: [workflow]
      operationId: listSystems
      summary: Sistemas bajo prueba
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/System' }
        default: { $ref: '#/components/responses/Problem' }

  /api/workflows/{entityType}:
    parameters:
      - $ref: '#/components/parameters/WorkflowEntityType'
    get:
      tags: [workflow]
      operationId: getWorkflow
      summary: Estados, transiciones y reglas de bloqueo de un flujo
      responses:
        '200':
          description: Flujo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }

  /api/admin/role-permissions:
    get:
      tags: [workflow]
      operationId: listRolePermissions
      summary: Permisos disponibles y su asignación por rol
      responses:
        '200':
          description: Permisos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePermissions' }
        default: { $ref: '#/components/responses/Problem' }

  /api/admin/role-permissions/{role}:
    parameters:
      - name: role
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Role' }
    put:
      tags: [workflow]
      operationId: setRolePermissions
      summary: Reemplaza los permisos de un rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Permisos actualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePermissions' }
        default: { $ref: '#/components/responses/Problem' }

  /api/admin/blocking-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [workflow]
      operationId: updateBlockingRule
      summary: Activa, desactiva o ajusta una regla de bloqueo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                blocks: { type: boolean }
                params: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Regla actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockingRule' }
        default: { $ref: '#/components/responses/Problem' }

  /api/admin/workflows/{entityType}/states:
    parameters:
      - $ref: '#/components/parameters/WorkflowEntityType'
    post:
      tags: [workflow]
      operationId: addWorkflowState
      summary: Agrega un estado a un flujo
      description: Exige `admin.configure`. El estado nace sin transiciones y nunca como inicial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key:
                  type: string
                  pattern: '^[a-z][a-z0-9_]{1,39}$'
                name: { type: string, minLength: 1, maxLength: 60 }
                position:
                  type: integer
                  minimum: 1
                  description: Orden en la línea de vida. Sin él, el estado es lateral.
                isFinal: { type: boolean }
      responses:
        '201':
          description: Flujo como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }

  /api/admin/workflows/{entityType}/states/{key}:
    parameters:
      - $ref: '#/components/parameters/WorkflowEntityType'
      - name: key
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [workflow]
      operationId: updateWorkflowState
      summary: Cambia el nombre de un estado o su lugar en la línea de vida
      description: Exige `admin.configure`. La clave no cambia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                position:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: Con `null`, el estado pasa a ser lateral.
      responses:
        '200':
          description: Flujo como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [workflow]
      operationId: removeWorkflowState
      summary: Quita un estado sin transiciones y sin registros
      description: Exige `admin.configure`. Responde `INVALID_ACTION` si el estado es el inicial, tiene transiciones o algún registro está en él.
      responses:
        '200':
          description: Flujo como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }

  /api/admin/workflows/{entityType}/transitions/{from}/{to}:
    parameters:
      - $ref: '#/components/parameters/WorkflowEntityType'
      - name: from
        in: path
        required: true
        schema: { type: string }
      - name: to
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [workflow]
      operationId: setWorkflowTransition
      summary: Agrega una transición o cambia su permiso y si exige motivo
      description: Exige `admin.configure`. Las reglas de bloqueo de una transición existente no cambian.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission: { type: string }
                requiresReason: { type: boolean }
      responses:
        '200':
          description: Flujo como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [workflow]
      operationId: removeWorkflowTransition
      summary: Quita una transición y sus reglas de bloqueo
      description: Exige `admin.configure`.
      responses:
        '200':
          description: Flujo como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }

  /api/changes:
    get:
      tags: [change]
      operationId: listChanges
      summary: Lista de CHG
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SystemKey'
        - $ref: '#/components/parameters/StateKey'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: Página de CHG
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Change' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [change]
      operationId: createChange
      summary: Crea un CHG
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeInput' }
      responses:
        '201':
          description: CHG creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Change' }
        default: { $ref: '#/components/responses/Problem' }

  /api/changes/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [change]
      operationId: getChange
      summary: Ficha de un CHG
      responses:
        '200':
          description: CHG
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Change' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [change]
      operationId: updateChange
      summary: Edita un CHG
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePatch' }
      responses:
        '200':
          description: CHG actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Change' }
        default: { $ref: '#/components/responses/Problem' }

  /api/changes/{code}/transitions:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      tags: [change]
      operationId: transitionChange
      summary: Cambia el estado de un CHG
      requestBody: { $ref: '#/components/requestBodies/Transition' }
      responses:
        '200':
          description: CHG en su nuevo estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Change' }
        default: { $ref: '#/components/responses/Problem' }

  /api/requirements:
    get:
      tags: [requirement]
      operationId: listRequirements
      summary: Lista de REQ
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SystemKey'
        - $ref: '#/components/parameters/StateKey'
        - $ref: '#/components/parameters/Query'
        - name: change
          in: query
          description: Código del CHG
          schema: { $ref: '#/components/schemas/Code' }
        - name: owner
          in: query
          description: ID del responsable actual
          schema: { type: string }
      responses:
        '200':
          description: Página de REQ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Requirement' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [requirement]
      operationId: createRequirement
      summary: Registra un REQ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequirementInput' }
      responses:
        '201':
          description: REQ registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requirement' }
        default: { $ref: '#/components/responses/Problem' }

  /api/requirements/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [requirement]
      operationId: getRequirement
      summary: Datos de un REQ
      responses:
        '200':
          description: REQ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requirement' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [requirement]
      operationId: updateRequirement
      summary: Edita un REQ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequirementPatch' }
      responses:
        '200':
          description: REQ actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requirement' }
        default: { $ref: '#/components/responses/Problem' }

  /api/requirements/{code}/transitions:
    parameters:
      - $ref: '#/components/parameters/Code'
    post:
      tags: [requirement]
      operationId: transitionRequirement
      summary: Cambia el estado de un REQ
      description: Si una regla de bloqueo no se cumple, responde 409 `INVALID_ACTION` con lo que falta en `detail`.
      requestBody: { $ref: '#/components/requestBodies/Transition' }
      responses:
        '200':
          description: REQ en su nuevo estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requirement' }
        default: { $ref: '#/components/responses/Problem' }

  /api/requirements/{code}/links:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [requirement]
      operationId: listRequirementLinks
      summary: Enlaces de un REQ
      responses:
        '200':
          description: Enlaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Link' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [requirement]
      operationId: createRequirementLink
      summary: Agrega un enlace
      description: Si la URL es de Google Sheets, el servidor extrae el ID de la hoja, la pestaña y el rango. No comprueba que exista.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkInput' }
      responses:
        '201':
          description: Enlace agregado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        default: { $ref: '#/components/responses/Problem' }

  /api/requirements/{code}/links/{id}:
    parameters:
      - $ref: '#/components/parameters/Code'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [requirement]
      operationId: updateRequirementLink
      summary: Edita un enlace, lo marca como oficial o le asocia una instantánea
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkPatch' }
      responses:
        '200':
          description: Enlace actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [requirement]
      operationId: deleteRequirementLink
      summary: Quita un enlace
      responses:
        '204': { description: Enlace quitado }
        default: { $ref: '#/components/responses/Problem' }

  /api/requirements/{code}/entry-contract:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [requirement]
      operationId: getEntryContract
      summary: Contrato de entrada dev → QA con el estado de cada ítem
      responses:
        '200':
          description: Contrato
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EntryContractItem' }
        default: { $ref: '#/components/responses/Problem' }

  /api/requirements/{code}/entry-contract/{itemKey}:
    parameters:
      - $ref: '#/components/parameters/Code'
      - name: itemKey
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [requirement]
      operationId: checkEntryContractItem
      summary: Marca un ítem como cumplido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Ítem cumplido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryContractItem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [requirement]
      operationId: uncheckEntryContractItem
      summary: Quita la marca de un ítem
      responses:
        '204': { description: Marca quitada }
        default: { $ref: '#/components/responses/Problem' }

  /api/requirements/{code}/risk:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [risk]
      operationId: getRisk
      summary: RISK vigente de un REQ
      responses:
        '200':
          description: RISK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Risk' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [risk]
      operationId: assessRisk
      summary: Evalúa o reevalúa el riesgo de un REQ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiskInput' }
      responses:
        '200':
          description: RISK guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Risk' }
        default: { $ref: '#/components/responses/Problem' }

  /api/requirements/{code}/functional-cases:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [testdesign]
      operationId: listFunctionalCases
      summary: UC de un REQ
      responses:
        '200':
          description: UC
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FunctionalCase' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [testdesign]
      operationId: createFunctionalCase
      summary: Define un UC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FunctionalCaseInput' }
      responses:
        '201':
          description: UC definido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionalCase' }
        default: { $ref: '#/components/responses/Problem' }

  /api/functional-cases/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [testdesign]
      operationId: getFunctionalCase
      summary: Datos de un UC
      responses:
        '200':
          description: UC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionalCase' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [testdesign]
      operationId: updateFunctionalCase
      summary: Edita un UC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FunctionalCaseInput' }
      responses:
        '200':
          description: UC actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionalCase' }
        default: { $ref: '#/components/responses/Problem' }

  /api/test-cases:
    get:
      tags: [testdesign]
      operationId: listTestCases
      summary: Lista de TC
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SystemKey'
        - $ref: '#/components/parameters/Query'
        - name: requirement
          in: query
          description: Código del REQ que el TC valida a través de sus UC
          schema: { $ref: '#/components/schemas/Code' }
        - name: critical
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Página de TC
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TestCase' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [testdesign]
      operationId: createTestCase
      summary: Define un TC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseInput' }
      responses:
        '201':
          description: TC definido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        default: { $ref: '#/components/responses/Problem' }

  /api/test-cases/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      tags: [testdesign]
      operationId: getTestCase
      summary: Datos de un TC
      responses:
        '200':
          description: TC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [testdesign]
      operationId: updateTestCase
      summary: Edita o retira un TC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCasePatch' }
      responses:
        '200':
          description: TC actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        default: { $ref: '#/components/responses/Problem' }

  /api/runs:
    get:
      tags: [execution]
      operationId: listRuns
      summary: Lista de RUN
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: testCase
          in: query
          schema: { $ref: '#/components/schemas/Code' }
        - name: requirement
          in: query
          schema: { $ref: '#/components/schemas/Code' }
        - name: buildVersion
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de RUN
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
