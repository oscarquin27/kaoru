          description: El CHG. Obligatorio en la certificación.
        startDate: { type: string, format: date }
        endDate:
          type: string
          format: date
          description: Inclusive.
        operators:
          type: array
          description: Ids de los operadores.
          items: { type: string }
        notes: { type: string }
    ActivityPatch:
      type: object
      properties:
        kind: { $ref: '#/components/schemas/ActivityKind' }
        title: { type: string, minLength: 1, maxLength: 200 }
        change:
          type: string
          description: Código del CHG. Vacío deja la actividad sin CHG.
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        operators:
          type: array
          description: Reemplaza la lista de operadores.
          items: { type: string }
        notes: { type: string }
        cancelled: { type: boolean }
    ActivityChange:
      type: object
      required: [code, title, system]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        system: { type: string }
    ActivitySummary:
      type: object
      required: [code, kind, title, startDate, endDate, status, operators]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        kind: { $ref: '#/components/schemas/ActivityKind' }
        title: { type: string }
        change: { $ref: '#/components/schemas/ActivityChange' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        operators:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
    ActivityOverlap:
      type: object
      description: Un operador con dos actividades que comparten días.
      required: [operator, activity, other, from, to, days]
      properties:
        operator: { $ref: '#/components/schemas/UserRef' }
        activity: { $ref: '#/components/schemas/ActivityRef' }
        other: { $ref: '#/components/schemas/ActivityRef' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer, minimum: 1 }
    ActivityRef:
      type: object
      required: [code, title, kind]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        kind: { $ref: '#/components/schemas/ActivityKind' }
    Activity:
      allOf:
        - $ref: '#/components/schemas/ActivitySummary'
        - type: object
          required: [notes, overlaps, createdBy, createdAt, updatedAt]
          properties:
            notes: { type: string }
            cancelledAt: { type: string, format: date-time }
            overlaps:
              type: array
              description: Los solapes de sus operadores con otras actividades no canceladas.
              items: { $ref: '#/components/schemas/ActivityOverlap' }
            createdBy: { $ref: '#/components/schemas/UserRef' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Schedule:
      type: object
      required: [from, to, summary, operators, unassigned, projects, windows, milestones]
      properties:
        from: { type: string, format: date }
        to:
          type: string
          format: date
          description: Inclusive.
        summary:
          type: object
          required: [activities, operators, overlaps]
          properties:
            activities: { type: integer }
            operators: { type: integer }
            overlaps: { type: integer }
        operators:
          type: array
          description: Por nombre.
          items:
            type: object
            required: [operator, activities, overlaps]
            properties:
              operator: { $ref: '#/components/schemas/UserRef' }
              activities:
                type: array
                items: { $ref: '#/components/schemas/ActivitySummary' }
              overlaps:
                type: array
                items: { $ref: '#/components/schemas/ActivityOverlap' }
        unassigned:
          type: array
          description: Actividades sin operador.
          items: { $ref: '#/components/schemas/ActivitySummary' }
        projects:
          type: array
          description: Los CHG con sus períodos de certificación en el rango.
          items:
            type: object
            required: [change, certifications]
            properties:
              change: { $ref: '#/components/schemas/ActivityChange' }
              certifications:
                type: array
                items: { $ref: '#/components/schemas/ActivitySummary' }
        windows:
          type: array
          description: Ventanas de cambio de los CHG vigentes que tocan el rango.
          items:
            type: object
            required: [change, system, start, end]
            properties:
              change: { $ref: '#/components/schemas/CodeTitle' }
              system: { type: string }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
        milestones:
          type: array
          description: Hitos con fecha en el rango.
          items: { $ref: '#/components/schemas/Milestone' }

    MetricsPeriod:
      type: object
      required: [from]
      properties:
        from: { type: string, format: date }
        to:
          type: string
          format: date
          description: Inclusive. Falta si el período no tiene fin.
    Days:
      type: number
      description: Días naturales, con un decimal.
    CoverageStatus:
      type: string
      description: >-
        `below`, por debajo del mínimo de su riesgo; `no_test_cases`, sin TC; `unassessed`, sin riesgo evaluado;
        `meets`, cumple (o ninguna regla activa le exige un mínimo).
      enum: [below, no_test_cases, unassessed, meets]
    CoverageMetrics:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [summary, items]
          properties:
            summary:
              type: object
              required: [requirements, below, noTestCases, unassessed, meets, requiredTestCases, passedTestCases]
              properties:
                requirements: { type: integer }
                below: { type: integer }
                noTestCases: { type: integer }
                unassessed: { type: integer }
                meets: { type: integer }
                requiredTestCases: { type: integer }
                passedTestCases: { type: integer }
            items:
              type: array
              items:
                type: object
                required: [requirement, system, state, required, passed, percent, status]
                properties:
                  requirement: { $ref: '#/components/schemas/CodeTitle' }
                  system: { type: string }
                  state: { $ref: '#/components/schemas/StateRef' }
                  riskLevel: { $ref: '#/components/schemas/RiskLevel' }
                  required: { type: integer, description: TC activos que exige el REQ. }
                  passed: { type: integer, description: 'De esos, los que tienen su último RUN aprobado.' }
                  percent: { type: integer, description: 'Cobertura, redondeada hacia abajo; 0 sin TC.' }
                  minimumPercent:
                    type: number
                    description: El mínimo que exige la regla para su riesgo. Falta sin riesgo o sin regla activa.
                  status: { $ref: '#/components/schemas/CoverageStatus' }
    DefectStateMetrics:
      type: object
      required: [period, total, states, resolution]
      properties:
        period: { $ref: '#/components/schemas/MetricsPeriod' }
        total: { type: integer, description: DEF creados en el período. }
        states:
          type: array
          description: Los estados del flujo del DEF, en el orden de su línea de vida.
          items:
            type: object
            required: [state, isFinal, current, defects, visits]
            properties:
              state: { $ref: '#/components/schemas/StateRef' }
              isFinal: { type: boolean }
              current: { type: integer, description: DEF que están hoy en el estado. }
              defects: { type: integer, description: DEF que pasaron por el estado. }
              visits: { type: integer, description: Veces que se entró al estado. }
              medianDays:
                allOf:
                  - $ref: '#/components/schemas/Days'
                description: Falta en un estado final o si nadie pasó por él.
              p90Days: { $ref: '#/components/schemas/Days' }
        resolution:
          type: object
          description: De la creación a la entrada en el estado final en que están hoy.
          required: [defects]
          properties:
            defects: { type: integer }
            medianDays: { $ref: '#/components/schemas/Days' }
            p90Days: { $ref: '#/components/schemas/Days' }
    RegressionMetrics:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [period, summary, items]
          properties:
            period: { $ref: '#/components/schemas/MetricsPeriod' }
            summary:
              type: object
              required: [packages, proposed, final, added, removed]
              properties:
                packages: { type: integer }
                proposed: { type: integer, description: 'TC propuestos, sumados.' }
                final: { type: integer, description: 'TC de las selecciones finales, sumados.' }
                added: { type: integer }
                removed: { type: integer }
                medianFinal: { type: number, description: Mediana de TC finales por PKG. Falta sin PKG. }
            items:
              type: array
              items:
                type: object
                required: [package, system, state, confirmedAt, proposed, final, added, removed, byOrigin, passed, systemTestCases]
                properties:
                  package: { $ref: '#/components/schemas/CodeTitle' }
                  system: { type: string }
                  state: { $ref: '#/components/schemas/StateRef' }
                  confirmedAt: { type: string, format: date-time }
                  proposed: { type: integer }
                  final: { type: integer }
                  added: { type: integer, description: TC que QA agregó a lo propuesto. }
                  removed: { type: integer, description: TC propuestos que QA quitó. }
                  byOrigin:
                    type: object
                    description: Los TC finales por origen.
                    required: [impact, critical, manual]
                    properties:
                      impact: { type: integer }
                      critical: { type: integer }
                      manual: { type: integer }
                  passed: { type: integer, description: TC finales con su último RUN sobre un BUILD del PKG aprobado. }
                  systemTestCases: { type: integer, description: TC activos del sistema hoy. }
    EscapedDefectMetrics:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [period, summary, months, items]
          properties:
            period: { $ref: '#/components/schemas/MetricsPeriod' }
            summary:
              type: object
              required: [defects, escaped, ratePercent]
              properties:
                defects: { type: integer, description: DEF creados en el período. }
                escaped: { type: integer }
                ratePercent: { type: number, description: 'Escapados / DEF, en %, con un decimal; 0 sin DEF.' }
            months:
              type: array
              description: Cada mes del período, en UTC, el más antiguo primero.
              items:
                type: object
                required: [month, defects, escaped]
                properties:
                  month: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-11' }
                  defects: { type: integer }
                  escaped: { type: integer }
            items:
              type: array
              items:
                type: object
                required: [defect, severity, state, requirement, package, releasedAt, createdAt, daysAfterRelease]
                properties:
                  defect: { $ref: '#/components/schemas/CodeTitle' }
                  severity: { $ref: '#/components/schemas/Severity' }
                  state: { $ref: '#/components/schemas/StateRef' }
                  requirement: { $ref: '#/components/schemas/Code' }
                  package:
                    allOf:
                      - $ref: '#/components/schemas/Code'
                    description: El PKG con el que el REQ llegó a producción.
                  releasedAt: { type: string, format: date-time }
                  createdAt: { type: string, format: date-time }
                  daysAfterRelease: { $ref: '#/components/schemas/Days' }

