              isInitial: { type: boolean }
              isFinal: { type: boolean }
        transitions:
          type: array
          items:
            type: object
            required: [from, to, permission, requiresReason, rules]
            properties:
              from: { type: string }
              to: { type: string }
              permission: { type: string }
              requiresReason: { type: boolean }
              rules:
                type: array
                items: { $ref: '#/components/schemas/BlockingRule' }

    BlockingRule:
      type: object
      required: [id, ruleKey, params, blocks, enabled]
      properties:
        id: { type: string, format: uuid }
        ruleKey: { type: string }
        params: { type: object, additionalProperties: true }
        route: { $ref: '#/components/schemas/Route' }
        blocks:
          type: boolean
          description: Con `false`, la regla solo avisa.
        enabled: { type: boolean }

    RolePermissions:
      type: object
      required: [permissions, roles]
      properties:
        permissions:
          type: array
          items:
            type: object
            required: [key, description]
            properties:
              key: { type: string }
              description: { type: string }
        roles:
          type: array
          items:
            type: object
            required: [role, permissions]
            properties:
              role: { $ref: '#/components/schemas/Role' }
              permissions:
                type: array
                items: { type: string }

    ChangeInput:
      type: object
      required: [title, system, route]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        system:
          type: string
          description: Clave del sistema
        route: { $ref: '#/components/schemas/Route' }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
    ChangePatch:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        route: { $ref: '#/components/schemas/Route' }
        windowStart: { type: string, format: date-time, nullable: true }
        windowEnd: { type: string, format: date-time, nullable: true }
    Change:
      type: object
      required: [code, title, description, system, route, state, createdBy, createdAt, updatedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        description: { type: string }
        system: { $ref: '#/components/schemas/System' }
        route: { $ref: '#/components/schemas/Route' }
        state: { $ref: '#/components/schemas/StateRef' }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RequirementInput:
      type: object
      required: [title, system]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        acceptanceCriteria: { type: string }
        system:
          type: string
          description: Clave del sistema
        change:
          allOf:
            - $ref: '#/components/schemas/Code'
          description: Código del CHG, si ya existe
        owner:
          type: string
          description: ID del responsable
    RequirementPatch:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        acceptanceCriteria: { type: string }
        change:
          type: string
          nullable: true
          description: Código del CHG; `null` lo quita.
        owner:
          type: string
          nullable: true
    Requirement:
      type: object
      required: [code, title, description, acceptanceCriteria, system, state, createdBy, createdAt, updatedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        description: { type: string }
        acceptanceCriteria: { type: string }
        system: { $ref: '#/components/schemas/System' }
        change: { $ref: '#/components/schemas/EntityRef' }
        state: { $ref: '#/components/schemas/StateRef' }
        owner: { $ref: '#/components/schemas/UserRef' }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LinkInput:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        kind:
          allOf:
            - $ref: '#/components/schemas/LinkKind'
          description: Si falta, el servidor lo deduce de la URL.
        label:
          type: string
          description: Si falta en un enlace de Google Sheets, se arma con la pestaña y el rango.
        isOfficial: { type: boolean }
    LinkPatch:
      type: object
      properties:
        label: { type: string }
        isOfficial: { type: boolean }
        snapshotDocument:
          type: string
          nullable: true
          description: Código del DOC con la instantánea; `null` la quita.
    Link:
      type: object
      required: [id, kind, label, url, isOfficial, addedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/LinkKind' }
        label: { type: string }
        url: { type: string, format: uri }
        sheet:
          type: object
          description: Solo en enlaces de Google Sheets.
          required: [id]
          properties:
            id: { type: string }
            gid: { type: string }
            range: { type: string }
        isOfficial: { type: boolean }
        snapshotDocument: { $ref: '#/components/schemas/Code' }
        addedBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }

    EntryContractItem:
      type: object
      required: [key, label, done]
      properties:
        key: { type: string }
        label: { type: string }
        done: { type: boolean }
        note: { type: string }
        checkedBy: { $ref: '#/components/schemas/UserRef' }
        checkedAt: { type: string, format: date-time }

    RiskInput:
      type: object
      required: [level, justification]
      properties:
        level: { $ref: '#/components/schemas/RiskLevel' }
        justification: { type: string, minLength: 1 }
        characteristics:
          type: array
          items: { $ref: '#/components/schemas/QualityCharacteristic' }
    Risk:
      type: object
      required: [code, level, justification, characteristics, assessedBy, updatedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        level: { $ref: '#/components/schemas/RiskLevel' }
        justification: { type: string }
        characteristics:
          type: array
          items: { $ref: '#/components/schemas/QualityCharacteristic' }
        assessedBy: { $ref: '#/components/schemas/UserRef' }
        updatedAt: { type: string, format: date-time }

    FunctionalCaseInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
    FunctionalCase:
      type: object
      required: [code, requirement, title, description, testCases, createdAt, updatedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        requirement: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        description: { type: string }
        testCases:
          type: array
          items: { $ref: '#/components/schemas/Code' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TestCaseInput:
      type: object
      required: [title, system, steps, expectedResult, functionalCases]
      properties:
        title: { type: string, minLength: 1 }
        system:
          type: string
          description: Clave del sistema
        preconditions: { type: string }
        steps: { type: string, minLength: 1 }
        expectedResult: { type: string, minLength: 1 }
        isCritical: { type: boolean }
        functionalCases:
          type: array
          minItems: 1
          description: Códigos de los UC que valida
          items: { $ref: '#/components/schemas/Code' }
    TestCasePatch:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        preconditions: { type: string }
        steps: { type: string, minLength: 1 }
        expectedResult: { type: string, minLength: 1 }
        isCritical: { type: boolean }
        functionalCases:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Code' }
        retired: { type: boolean }
    TestCase:
      type: object
      required: [code, title, system, preconditions, steps, expectedResult, isCritical, retired, functionalCases, createdAt, updatedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        system: { $ref: '#/components/schemas/System' }
        preconditions: { type: string }
        steps: { type: string }
        expectedResult: { type: string }
        isCritical: { type: boolean }
        retired: { type: boolean }
        functionalCases:
          type: array
          items: { $ref: '#/components/schemas/Code' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RunInput:
      type: object
      description: >-
        El RUN se registra sobre un BUILD y un ENV del catálogo, del mismo sistema que el TC.
        Un ambiente de producción no admite RUN: QA no ejecuta en producción.
      required: [testCase, build, environment, result, executedAt]
      properties:
        testCase: { $ref: '#/components/schemas/Code' }
        build: { $ref: '#/components/schemas/Code' }
        environment: { $ref: '#/components/schemas/Code' }
        result: { $ref: '#/components/schemas/RunResult' }
        notes: { type: string }
        executedAt:
          type: string
          format: date-time
          description: Cuándo se ejecutó la prueba. No puede ser futura.
    RunSummary:
      type: object
      required: [code, result, buildVersion, environmentName, executedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        result: { $ref: '#/components/schemas/RunResult' }
        buildVersion: { type: string }
        environmentName: { type: string }
        build:
          allOf:
            - $ref: '#/components/schemas/Code'
          description: Ausente en los RUN anteriores al catálogo de BUILD.
        environment:
          allOf:
            - $ref: '#/components/schemas/Code'
          description: Ausente en los RUN anteriores al catálogo de ambientes.
        executedAt: { type: string, format: date-time }
    Run:
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          required: [testCase, buildChecksum, notes, executedBy, createdAt]
          properties:
            testCase: { $ref: '#/components/schemas/EntityRef' }
            buildChecksum: { $ref: '#/components/schemas/Checksum' }
            notes: { type: string }
            executedBy: { $ref: '#/components/schemas/UserRef' }
            createdAt: { type: string, format: date-time }

    ExplorationInput:
      type: object
      description: La exploración se registra sobre un BUILD y un ENV del catálogo, del sistema del REQ.
      required: [requirement, build, environment, executedAt]
      properties:
        requirement: { $ref: '#/components/schemas/Code' }
        build: { $ref: '#/components/schemas/Code' }
        environment: { $ref: '#/components/schemas/Code' }
        manualChanges: { type: string }
        findings: { type: string }
        executedAt: { type: string, format: date-time }
    Exploration:
      type: object
      required: [code, requirement, buildVersion, environmentName, manualChanges, findings, executedBy, executedAt, createdAt, updatedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        requirement: { $ref: '#/components/schemas/Code' }
        buildVersion: { type: string }
        environmentName: { type: string }
        build:
          allOf:
            - $ref: '#/components/schemas/Code'
          description: Ausente en las exploraciones anteriores al catálogo de BUILD.
        environment:
          allOf:
            - $ref: '#/components/schemas/Code'
          description: Ausente en las exploraciones anteriores al catálogo de ambientes.
        manualChanges: { type: string }
        findings: { type: string }
        executedBy: { $ref: '#/components/schemas/UserRef' }
        executedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DefectInput:
      type: object
      required: [title, description, requirement, run, severity]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        requirement: { $ref: '#/components/schemas/Code' }
        run:
          allOf:
            - $ref: '#/components/schemas/Code'
          description: RUN que reprodujo el defecto
        severity: { $ref: '#/components/schemas/Severity' }
        assignee: { type: string }
    DefectPatch:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        severity: { $ref: '#/components/schemas/Severity' }
        assignee:
          type: string
          nullable: true
    Defect:
      type: object
      required: [code, title, description, requirement, run, severity, state, daysInState, createdBy, createdAt, updatedAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        description: { type: string }
        requirement: { $ref: '#/components/schemas/Code' }
        run: { $ref: '#/components/schemas/Code' }
        severity: { $ref: '#/components/schemas/Severity' }
        state: { $ref: '#/components/schemas/StateRef' }
        daysInState:
          type: number
          description: Tiempo en el estado actual, calculado al leer. No hay SLA.
        assignee: { $ref: '#/components/schemas/UserRef' }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DocumentVersion:
      type: object
      required: [version, fileName, mediaType, sizeBytes, checksum, uploadedBy, createdAt, previewable]
      properties:
        version: { type: integer }
        fileName: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        checksum: { $ref: '#/components/schemas/Checksum' }
        uploadedBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        previewable:
          type: boolean
          description: Hay vista previa en PDF (`/preview`) de un archivo de Office. Solo si el servidor tiene conversor.
    Document:
      type: object
      required: [code, title, kind, versions, linkedTo, createdAt]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        versions:
          type: array
          description: De la más reciente a la más antigua.
          items: { $ref: '#/components/schemas/DocumentVersion' }
        linkedTo:
          type: array
          items:
            type: object
            required: [type, code]
            properties:
              type: { $ref: '#/components/schemas/EntityType' }
              code: { $ref: '#/components/schemas/Code' }
        createdAt: { type: string, format: date-time }

    Comment:
      type: object
      required: [id, body, author, createdAt]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        author: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }

    SearchHit:
      type: object
      required: [type, code, title]
      properties:
        type:
          type: string
          enum: [requirement, change, risk_assessment, functional_case, test_case, test_run, exploratory_session, defect, document, component, build, package, environment, deployment, checklist, diagnostic, smoke_test, report]
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        state: { $ref: '#/components/schemas/StateRef' }

    RequirementOverview:
      type: object
      description: Lectura plana que arma `traceability` cruzando los demás features.
      required: [requirement, lifecycle, missing, coverage, functionalCases, testCases, defects]
      properties:
        requirement:
          type: object
          required: [code, title, description, acceptanceCriteria, system, route, state, createdAt, updatedAt]
          properties:
            code: { $ref: '#/components/schemas/Code' }
            title: { type: string }
            description: { type: string }
            acceptanceCriteria: { type: string }
            system:
              type: object
              required: [key, name]
              properties:
                key: { type: string }
                name: { type: string }
            change: { $ref: '#/components/schemas/CodeTitle' }
            route: { $ref: '#/components/schemas/Route' }
            state: { $ref: '#/components/schemas/StateRef' }
            owner: { $ref: '#/components/schemas/UserRef' }
            risk:
              type: object
              description: Ausente si el riesgo no está evaluado.
              required: [code, level, justification]
              properties:
                code: { $ref: '#/components/schemas/Code' }
                level: { $ref: '#/components/schemas/RiskLevel' }
                justification: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        lifecycle:
          type: array
          description: Etapas del ciclo en orden, para la línea de vida. Un estado lateral no es una etapa.
          items:
            type: object
            required: [state, status, days]
            properties:
              state: { $ref: '#/components/schemas/StateRef' }
              status:
                type: string
                enum: [done, current, pending, blocked]
              enteredAt: { type: string, format: date-time }
              days:
                type: number
                description: Tiempo acumulado en la etapa, calculado al leer.
        missing:
          type: array
          description: Qué falta para avanzar, por cada transición posible desde el estado actual.
          items: { $ref: '#/components/schemas/Missing' }
        coverage:
          type: object
          required: [required, passed]
          properties:
            required:
              type: integer
              description: TC activos que validan algún UC del REQ
            passed:
              type: integer
              description: TC cuyo último RUN está aprobado
        functionalCases:
          type: array
          items: { $ref: '#/components/schemas/CodeTitle' }
        testCases:
          type: array
          items: { $ref: '#/components/schemas/TestCaseSummary' }
        defects:
          type: array
          items: { $ref: '#/components/schemas/DefectSummary' }

    CodeTitle:
      type: object
      required: [code, title]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }

    TestCaseSummary:
      type: object
      required: [code, title, isCritical, retired]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        isCritical: { type: boolean }
        retired: { type: boolean }
        lastRun: { $ref: '#/components/schemas/RunSummary' }

    DefectSummary:
      type: object
      required: [code, severity, state]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        title: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        state: { $ref: '#/components/schemas/StateRef' }

    Matrix:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [indicators, items]
          properties:
            indicators:
              type: object
              description: De todo lo filtrado, no solo de la página.
              required: [coveragePercent, requiredTestCases, passedTestCases, blockedRequirements, openDefects]
              properties:
                coveragePercent: { type: integer }
                requiredTestCases: { type: integer }
                passedTestCases: { type: integer }
                blockedRequirements:
                  type: integer
                  description: REQ con algún DEF de severidad alta abierto.
                openDefects:
                  type: object
                  required: [high, medium, low]
                  properties:
                    high: { type: integer }
                    medium: { type: integer }
                    low: { type: integer }
            items:
              type: array
              description: Una fila por REQ y TC. Un REQ sin TC aparece en una fila sin `testCase`.
              items:
                type: object
                required: [requirement, system, state, packages, reports, functionalCases, defects]
                properties:
                  requirement: { $ref: '#/components/schemas/CodeTitle' }
                  system: { type: string }
                  state: { $ref: '#/components/schemas/StateRef' }
                  change: { $ref: '#/components/schemas/Code' }
                  risk: { $ref: '#/components/schemas/Code' }
                  riskLevel: { $ref: '#/components/schemas/RiskLevel' }
                  owner: { type: string }
                  packages:
                    type: array
                    description: Los PKG que incluyen el REQ.
                    items: { $ref: '#/components/schemas/Code' }
                  reports:
                    type: array
                    description: El informe de conformidad vigente de cada uno de esos PKG.
                    items: { $ref: '#/components/schemas/Code' }
                  functionalCases:
                    type: array
                    items: { $ref: '#/components/schemas/Code' }
                  testCase: { $ref: '#/components/schemas/TestCaseSummary' }
                  defects:
                    type: array
                    description: Los DEF reproducidos en un RUN de ese TC.
                    items: { $ref: '#/components/schemas/DefectSummary' }

    AuditEntry:
      type: object
      required: [seq, occurredAt, actor, entityType, action, hash]
      properties:
        seq: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/UserRef' }
        entityType: { type: string }
        entityCode: { $ref: '#/components/schemas/Code' }
        action:
          type: string
          enum: [create, update, transition, decision, delete]
        field: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        reason: { type: string }
        prevHash: { $ref: '#/components/schemas/Checksum' }
        hash: { $ref: '#/components/schemas/Checksum' }
